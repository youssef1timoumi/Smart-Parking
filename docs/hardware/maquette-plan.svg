<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1558d6"/>
    </marker>
    <style>
      .chip { fill:#0f172a; }
      .chiptx { fill:#fff; font-size:11px; font-weight:700; }
    </style>
  </defs>

  <rect width="1040" height="740" fill="#f4f6fa"/>
  <text x="34" y="44" font-size="25" font-weight="700" fill="#0f172a">Smart Parking — small maquette: layout + ESP32 wiring (top view)</text>
  <text x="34" y="67" font-size="13.5" fill="#64748b">Boxes = where each piece sits on the small model. Coloured lines = wires from the ESP32. Wiring is the same whatever the model's size.</text>

  <!-- ================= BASE BOARD ================= -->
  <rect x="34" y="86" width="672" height="624" rx="10" fill="#5b6472" stroke="#3b4350" stroke-width="2"/>
  <text x="46" y="106" font-size="12" fill="#e8edf5" opacity=".75">BASE (cardboard)</text>

  <!-- Covered roof over Slot 1 -->
  <rect x="64" y="134" width="276" height="236" rx="8" fill="#93c5fd" fill-opacity=".13" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="74" y="152" font-size="11.5" font-weight="700" fill="#bfdbfe">ROOF (covered) over Slot 1</text>

  <!-- Slot 1 -->
  <rect x="82" y="170" width="240" height="188" rx="4" fill="#2f3a49" stroke="#f8fafc" stroke-width="3"/>
  <text x="202" y="286" font-size="56" font-weight="800" fill="#ffffff" fill-opacity=".16" text-anchor="middle">1</text>
  <text x="202" y="350" font-size="12.5" fill="#cbd5e1" text-anchor="middle">SLOT 1 (covered)</text>
  <!-- HC-SR04 -->
  <rect x="167" y="178" width="70" height="24" rx="5" fill="#334155" stroke="#94a3b8"/>
  <circle cx="185" cy="190" r="7" fill="#0b1018" stroke="#94a3b8"/>
  <circle cx="219" cy="190" r="7" fill="#0b1018" stroke="#94a3b8"/>

  <!-- Slot 2 -->
  <rect x="358" y="170" width="240" height="188" rx="4" fill="#2f3a49" stroke="#f8fafc" stroke-width="3"/>
  <text x="478" y="286" font-size="56" font-weight="800" fill="#ffffff" fill-opacity=".16" text-anchor="middle">2</text>
  <text x="478" y="350" font-size="12.5" fill="#cbd5e1" text-anchor="middle">SLOT 2 (outdoor)</text>
  <!-- parked car -->
  <rect x="430" y="232" width="96" height="88" rx="15" fill="#3b82f6"/>
  <rect x="446" y="248" width="64" height="32" rx="7" fill="#1e3a8a"/>
  <!-- KY-032 IR -->
  <rect x="443" y="178" width="70" height="24" rx="5" fill="#334155" stroke="#94a3b8"/>
  <circle cx="461" cy="190" r="6" fill="#7f1d1d"/>
  <circle cx="495" cy="190" r="6" fill="#0b1018" stroke="#94a3b8"/>

  <!-- Water / rain sensor -->
  <rect x="300" y="112" width="52" height="20" rx="4" fill="#1e3a5f" stroke="#60a5fa"/>
  <text x="326" y="126" font-size="9.5" fill="#bfdbfe" text-anchor="middle">WATER</text>

  <!-- ENTRANCE LANE -->
  <rect x="50" y="500" width="640" height="150" rx="6" fill="#1f2631"/>
  <line x1="50" y1="575" x2="690" y2="575" stroke="#ffffff" stroke-opacity=".32" stroke-width="3" stroke-dasharray="20 16"/>
  <text x="62" y="522" font-size="11.5" font-weight="700" fill="#e8edf5" opacity=".75">ENTRANCE LANE</text>
  <line x1="62" y1="620" x2="140" y2="620" stroke="#1558d6" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="62" y="642" font-size="11.5" fill="#cbd5e1">car IN</text>

  <!-- Barrier / servo -->
  <rect x="300" y="500" width="13" height="150" fill="#1e293b" stroke="#64748b"/>
  <rect x="286" y="486" width="41" height="24" rx="5" fill="#334155" stroke="#94a3b8"/>
  <g>
    <rect x="313" y="534" width="150" height="11" rx="3" fill="#ef4444"/>
    <rect x="333" y="534" width="18" height="11" fill="#f8fafc"/>
    <rect x="371" y="534" width="18" height="11" fill="#f8fafc"/>
    <rect x="409" y="534" width="18" height="11" fill="#f8fafc"/>
    <rect x="447" y="534" width="10" height="11" fill="#f8fafc"/>
  </g>

  <!-- RC522 reader -->
  <rect x="150" y="516" width="68" height="54" rx="6" fill="#2d3748" stroke="#60a5fa" stroke-width="2"/>
  <path d="M176 540 q8 6 0 14 M184 534 q14 10 0 26" fill="none" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="167" cy="560" r="3" fill="#34d399"/>

  <!-- LCD -->
  <rect x="470" y="586" width="150" height="52" rx="6" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/>
  <text x="545" y="608" font-size="12" fill="#6ee7b7" text-anchor="middle" font-family="monospace">Welcome Ahmed</text>
  <text x="545" y="626" font-size="12" fill="#6ee7b7" text-anchor="middle" font-family="monospace">Credit: 20.00 DT</text>

  <!-- ================= ESP32 HUB (on the board) ================= -->
  <g>
    <rect x="300" y="392" width="150" height="66" rx="8" fill="#0b1b3a" stroke="#1558d6" stroke-width="2"/>
    <rect x="316" y="408" width="34" height="34" rx="5" fill="#1558d6"/>
    <text x="333" y="432" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">E</text>
    <path d="M364 420 a9 9 0 0 1 15 0 M368 426 a4.5 4.5 0 0 1 7 0" fill="none" stroke="#6b9bff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="371.5" cy="431" r="2.2" fill="#6b9bff"/>
    <text x="392" y="418" font-size="13.5" font-weight="700" fill="#e8edf5">ESP32-S</text>
    <text x="392" y="434" font-size="10.5" fill="#9fb3d1">controller (WiFi)</text>
    <text x="392" y="449" font-size="10.5" fill="#9fb3d1">the brain — wires below</text>
  </g>

  <!-- ===== WIRES (working = solid, planned Task 5 = dashed) ===== -->
  <!-- RC522 : SPI, solid blue -->
  <path d="M312 440 C 250 470, 200 500, 190 516" fill="none" stroke="#3b82f6" stroke-width="2.6"/>
  <circle cx="190" cy="516" r="3.5" fill="#3b82f6"/>
  <rect class="chip" x="206" y="470" width="150" height="18" rx="4"/>
  <text class="chiptx" x="213" y="483">RC522  P5·18·19·23 · RST P22</text>

  <!-- LCD : solid green -->
  <path d="M440 440 C 520 480, 560 540, 548 586" fill="none" stroke="#22c55e" stroke-width="2.6"/>
  <circle cx="548" cy="586" r="3.5" fill="#22c55e"/>
  <rect class="chip" x="470" y="520" width="118" height="18" rx="4"/>
  <text class="chiptx" x="477" y="533">LCD  SDA P21 · SCL P17</text>

  <!-- Servo : dashed amber (planned) -->
  <path d="M312 452 C 300 480, 300 480, 307 486" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="7 5"/>
  <circle cx="307" cy="486" r="3.5" fill="#f59e0b"/>
  <rect class="chip" x="196" y="492" width="96" height="18" rx="4"/>
  <text class="chiptx" x="203" y="505">Servo P13 (T5)</text>

  <!-- HC-SR04 : dashed grey (planned) -->
  <path d="M322 400 C 260 320, 220 250, 205 204" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <circle cx="205" cy="204" r="3.5" fill="#94a3b8"/>
  <rect class="chip" x="232" y="236" width="150" height="18" rx="4"/>
  <text class="chiptx" x="239" y="249">HC-SR04  Trig P26 · Echo P25 (T5)</text>

  <!-- KY-032 : dashed grey (planned) -->
  <path d="M420 400 C 470 320, 480 250, 478 204" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <circle cx="478" cy="204" r="3.5" fill="#94a3b8"/>
  <rect class="chip" x="486" y="250" width="110" height="18" rx="4"/>
  <text class="chiptx" x="493" y="263">KY-032 IR  P34 (T5)</text>

  <!-- Water : dashed blue (planned) -->
  <path d="M332 392 C 326 280, 326 200, 326 132" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <circle cx="326" cy="132" r="3.5" fill="#38bdf8"/>
  <rect class="chip" x="356" y="150" width="140" height="18" rx="4"/>
  <text class="chiptx" x="363" y="163">Water sensor  P35 (T5)</text>

  <!-- power note -->
  <rect x="300" y="664" width="390" height="30" rx="6" fill="#111827"/>
  <circle cx="318" cy="679" r="5" fill="#ef4444"/><text x="330" y="683" font-size="11.5" fill="#fca5a5">+ 3V3 rail</text>
  <circle cx="420" cy="679" r="5" fill="#0f172a" stroke="#cbd5e1"/><text x="432" y="683" font-size="11.5" fill="#cbd5e1">− GND rail</text>
  <text x="500" y="683" font-size="11.5" fill="#e2e8f0">power every module via the breadboard rails (3.3V only)</text>

  <!-- ================= RIGHT: LEGEND ================= -->
  <rect x="716" y="86" width="298" height="624" rx="10" fill="#ffffff" stroke="#e1e7f0" stroke-width="2"/>
  <text x="738" y="118" font-size="15" font-weight="800" fill="#0f172a">WIRING KEY</text>

  <line x1="738" y1="138" x2="786" y2="138" stroke="#3b82f6" stroke-width="3"/>
  <text x="796" y="142" font-size="12.5" fill="#1b2430">solid = wired &amp; working now</text>
  <line x1="738" y1="160" x2="786" y2="160" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="796" y="164" font-size="12.5" fill="#1b2430">dashed = planned (Task 5)</text>

  <text x="738" y="196" font-size="13.5" font-weight="700" fill="#0f172a">ESP32 PIN MAP</text>
  <g font-size="12.5" fill="#1b2430">
    <text x="738" y="220" font-weight="700" fill="#2563eb">RC522 (RFID reader)</text>
    <text x="748" y="238" fill="#475569">SS→P5 · SCK→P18 · MOSI→P23</text>
    <text x="748" y="255" fill="#475569">MISO→P19 · RST→P22 · 3V3 · GND</text>

    <text x="738" y="283" font-weight="700" fill="#16a34a">16×2 I2C LCD</text>
    <text x="748" y="301" fill="#475569">SDA→P21 · SCL→P17 · VCC(3V3) · GND</text>

    <text x="738" y="329" font-weight="700" fill="#b45309">SG90 servo — barrier (T5)</text>
    <text x="748" y="347" fill="#475569">signal→P13 · VCC · GND</text>

    <text x="738" y="375" font-weight="700" fill="#475569">HC-SR04 — Slot 1 (T5)</text>
    <text x="748" y="393" fill="#475569">Trig→P26 · Echo→P25 (via divider)</text>

    <text x="738" y="421" font-weight="700" fill="#991b1b">KY-032 IR — Slot 2 (T5)</text>
    <text x="748" y="439" fill="#475569">OUT→P34 · VCC · GND</text>

    <text x="738" y="467" font-weight="700" fill="#0369a1">Water sensor — rain (T5)</text>
    <text x="748" y="485" fill="#475569">AO→P35 · VCC · GND</text>
  </g>

  <rect x="730" y="506" width="270" height="92" rx="8" fill="#f7f9fc" stroke="#e1e7f0"/>
  <text x="742" y="528" font-size="12.5" font-weight="700" fill="#0f172a">Backend = source of truth</text>
  <text x="742" y="547" font-size="11" fill="#475569">Laptop/VPS runs the server + database.</text>
  <text x="742" y="564" font-size="11" fill="#475569">Owner, balance (solde) &amp; status live there.</text>
  <text x="742" y="581" font-size="11" fill="#475569">The card holds only its UID — no money on it.</text>

  <text x="730" y="624" font-size="12.5" font-weight="700" fill="#0f172a">FLOW</text>
  <text x="730" y="644" font-size="11" fill="#475569">Tap card → ESP32 asks backend → allow/deny</text>
  <text x="730" y="661" font-size="11" fill="#475569">→ LCD shows name + credit → barrier opens.</text>
  <text x="730" y="678" font-size="11" fill="#475569">Everything also shows on the web dashboard.</text>

  <text x="730" y="700" font-size="10.5" fill="#94a3b8">T5 = Task 5 (not wired/coded yet)</text>
</svg>

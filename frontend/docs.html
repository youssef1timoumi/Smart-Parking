<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Parking — API Docs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231558d6'/%3E%3Cpath d='M12 24V8h5.5a4.5 4.5 0 0 1 0 9H12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>try { var th = localStorage.getItem('theme'); if (!th && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) th = 'dark'; if (th === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="docs-header">
    <div class="docs-header-inner">
      <a class="brand-logo" href="/home/" aria-label="Smart Parking">
        <span class="brand-icon-box">
          <svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 25V7h6.5a5 5 0 0 1 0 10H11"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Smart Parking</span>
          <span class="brand-sub" data-t="title"></span>
        </span>
      </a>
      <div class="docs-actions">
        <a class="btn btn-outline btn-sm" href="/home/" data-t="dash"></a>
        <button class="icon-btn" id="theme-toggle" type="button" onclick="toggleTheme()"></button>
        <div class="lang-switcher">
          <button data-lang="en" class="lang-btn" type="button">EN</button>
          <button data-lang="fr" class="lang-btn" type="button">FR</button>
        </div>
      </div>
    </div>
  </header>

  <main class="docs-main">
    <div id="root" class="muted">Loading…</div>
  </main>

  <script>
    const UI = {
      en: { title: 'API docs', dash: '← Dashboard', base: 'Base URL', api: 'Endpoints', front: 'Frontend', body: 'Request body (JSON)', resp: 'Response', errors: 'Errors', caller: 'Called by', undoc: 'Undocumented routes (add them to backend/docs.js)', themeDark: 'Switch to dark theme', themeLight: 'Switch to light theme' },
      fr: { title: 'Doc de l\'API', dash: '← Tableau de bord', base: 'URL de base', api: 'Endpoints', front: 'Frontend', body: 'Corps de la requête (JSON)', resp: 'Réponse', errors: 'Erreurs', caller: 'Appelé par', undoc: 'Routes non documentées (à ajouter dans backend/docs.js)', themeDark: 'Passer au thème sombre', themeLight: 'Passer au thème clair' },
    };
    let docs = null;
    let lang = 'en';
    try { lang = localStorage.getItem('lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en'); } catch {}

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const json = (o) => `<pre>${esc(JSON.stringify(o, null, 2))}</pre>`;

    const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const isDark = () => document.documentElement.dataset.theme === 'dark';
    function updateThemeButton() {
      const b = document.getElementById('theme-toggle');
      b.innerHTML = isDark() ? ICON_SUN : ICON_MOON;
      b.title = UI[lang][isDark() ? 'themeLight' : 'themeDark'];
      b.setAttribute('aria-label', b.title);
    }
    function toggleTheme() {
      const next = isDark() ? 'light' : 'dark';
      if (next === 'dark') document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
      try { localStorage.setItem('theme', next); } catch {}
      updateThemeButton();
    }

    function render() {
      const t = UI[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
      document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('active', b.dataset.lang === lang));
      updateThemeButton();
      if (!docs) return;
      let h = `<div class="card"><p>${esc(docs.intro[lang])}</p><div class="muted">${t.base}: <code>${esc(docs.baseUrl)}</code></div></div>`;
      if (docs.undocumented.length) {
        h += `<div class="card warn"><strong>${t.undoc}</strong><ul>${docs.undocumented.map((r) => `<li><code>${r.method} ${esc(r.path)}</code></li>`).join('')}</ul></div>`;
      }
      h += `<h2>${t.api}</h2>`;
      for (const e of docs.endpoints) {
        h += `<div class="card"><div class="ep-head"><span class="method ${e.method}">${e.method}</span><span class="path">${esc(e.path)}</span></div>`;
        h += `<p>${esc(e.summary[lang])}</p><div class="muted">${t.caller}: ${esc(e.caller[lang])}</div>`;
        if (e.body) h += `<div class="label">${t.body}</div>${json(e.body)}`;
        if (e.response) h += `<div class="label">${t.resp}</div>${json(e.response)}`;
        if (e.errors) h += `<div class="label">${t.errors}</div>` + e.errors.map((x) => `<div class="muted">HTTP ${x.status}</div>${json(x.body)}`).join('');
        h += `</div>`;
      }
      h += `<h2>${t.front}</h2><div class="card"><ul>${docs.frontend[lang].map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
      document.getElementById('root').innerHTML = h;
    }

    document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
      lang = b.dataset.lang;
      try { localStorage.setItem('lang', lang); } catch {}
      render();
    });

    fetch('/api/docs').then((r) => r.json()).then((d) => { docs = d; render(); })
      .catch(() => { document.getElementById('root').textContent = 'Failed to load /api/docs'; });
    render();
  </script>
</body>
</html>
